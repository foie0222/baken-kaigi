name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    branches: [main]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            PR #${{ github.event.pull_request.number }} のコードレビューを行ってください。

            まず `gh pr diff ${{ github.event.pull_request.number }}` でPRの差分を取得し、
            変更内容を分析してください。

            ## レビュー観点

            1. **セキュリティ** - 入力検証、認証、認可、IAM最小権限、シークレットのハードコード
            2. **コード品質** - DDD原則、早期リターン、単一責任、マジックナンバー禁止、any型禁止(TS)、具体的例外型(Python)
            3. **パフォーマンス** - N+1問題、不要な再レンダリング、DynamoDBクエリ効率性
            4. **テスト** - 新機能のテスト追加、エッジケースカバレッジ
            5. **エラーハンドリング** - エラー握りつぶし、フォールバック多用の回避

            ## 指摘の投稿方法

            - 具体的なコードの問題は `mcp__github_inline_comment__create_inline_comment` を使い、
              該当行にインラインコメントとして投稿してください。これにより解決必須のスレッドが作られます。
            - 全体の総評は `gh pr review ${{ github.event.pull_request.number }} --comment --body "..."` で
              PRレビューとして投稿してください。
            - テキストメッセージとしてレビュー結果を返さないでください。必ずGitHubコメントとして投稿してください。
          claude_args: |
            --max-turns 15
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*),Bash(cat:*),Bash(wc:*),Read,Glob,Grep"
